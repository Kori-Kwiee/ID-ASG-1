<!DOCTYPE html>
<html>

    <nav>
      <a href="index.html">About</a>

    <div class="hero hero-ivan" >
      <a href="singers.html"
      data-text="Profile">
        Profile
      </a>
    </div>
    
    <button id="toggle-glitch-btn">Traumatize them!</button>

    <section>
      <h2>Singers</h2>
      <h3>Meet our talented competitors:</h3>

      <div class="profiles-container">
        <div class="profile-wrapper" >
          <a href="mizi.html">
            <p class="profile-name">Mizi</p>
            <div class="profile">
              <img class="profile-pic left" src="images/mizi.jpg" alt="mizi"> 
            </div>
          </a>
        </div>
      
        <div class="profile-wrapper">
          <a href="sua.html">
            <p class="profile-name"> Sua </p>
            <div class="profile">
              <img class="profile-pic left" src="images/sua.jpg" alt="sua">
            </div>
          </a>
        </div>

        <div class="profile-wrapper">
          <a href="ivan.html">
            <p class="profile-name"> Ivan </p>
            <div class="profile">
              <img class="profile-pic left" src="images/ivan.jpg" alt="ivan">
            </div>
          </a>
        </div>

        <div class="profile-wrapper">
          <a href="till.html">
            <p class="profile-name"> Till </p>
            <div class="profile">
              <img class="profile-pic left" src="images/till.jpg" alt="till">

        </div>

        <div class="profile-wrapper">
          <a href="hyuna.html">

    <footer>© Vivinos ALIEN STAGE. Fanmade project by Kori.</footer>

    <script>
      const toggleBtn = document.getElementById("toggle-glitch-btn");
      const hero = document.querySelector(".hero");

      toggleBtn.addEventListener("click", () => {
        hero.classList.toggle("glitch");

        if (hero.classList.contains("glitch")) {
          toggleBtn.textContent = "Stop trauma!";
        } else {
          toggleBtn.textContent = "Traumatize them!";
        }
      });
    </script>
